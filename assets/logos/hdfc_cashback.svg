<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- HDFC Bank Square Emblem -->
  <g transform="translate(8, 7)">
    <rect x="0" y="0" width="46" height="46" rx="4" fill="#004C8F"/>
    <rect x="6" y="6" width="34" height="34" fill="#ED232A"/>
    <rect x="14" y="6" width="18" height="34" fill="#004C8F"/>
    <rect x="6" y="14" width="34" height="18" fill="#004C8F"/>
    <rect x="14" y="14" width="18" height="18" fill="#FFFFFF"/>
  </g>
  
  <!-- HDFC Bank & Cashback Typography -->
  <text x="64" y="26" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#004C8F" letter-spacing="1">HDFC BANK</text>
  <text x="64" y="50" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ED232A" letter-spacing="0.5">Cashback</text>
</svg>
